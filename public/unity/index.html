<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#130a09"><title>曲率航迹 · 三体雷电</title><style>
*{box-sizing:border-box}body{margin:0;background:#100a09;color:#eadcd0;font:14px system-ui,sans-serif;min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center}header,footer{width:min(100%,1600px);padding:14px 24px;display:flex;align-items:center;justify-content:space-between;gap:16px}header{font-size:12px;letter-spacing:3px;color:#bba492}strong{color:#efdbbf;font-size:15px;letter-spacing:5px}main{position:relative;width:min(100vw,calc((100svh - 114px)*16/9),1600px);aspect-ratio:16/9;background:#080505;box-shadow:0 0 80px #6c25151a}canvas{width:100%;height:100%;display:block;outline:0;touch-action:none}#loading{position:absolute;inset:0;display:grid;place-content:center;text-align:center;background:radial-gradient(ellipse at center,#341710,#100a09);padding:30px}h1{font-size:clamp(28px,5vw,64px);font-weight:500;letter-spacing:.2em;margin:18px 0}#status{color:#d8bc9d;letter-spacing:2px}progress{width:min(320px,60vw);height:3px;margin:18px auto;accent-color:#f4ab64}footer{font-size:12px;color:#a99584;letter-spacing:1px}button{border:1px solid #8a6748;background:#301d14;color:#f3d7b8;border-radius:4px;padding:8px 16px;cursor:pointer}button:focus-visible{outline:2px solid #f4ab64}#retry{display:none;margin:auto}#rotate{display:none}@media(max-width:700px){header,footer{padding:10px 12px;letter-spacing:0}footer{flex-wrap:wrap;font-size:10px}header span{display:none}main{width:100vw}}@media(orientation:portrait){#rotate{display:inline;color:#e6b875}}
</style></head><body><header><strong>曲率航迹</strong><span>三体 · 黑暗森林</span><button id="fullscreen" type="button">全屏</button></header><main><canvas id="unity-canvas" tabindex="0" aria-label="曲率航迹游戏，WASD 或方向键移动，J 智子场，K 二向箔，L 曲率冲刺"></canvas><div id="loading"><div>三体 · 黑暗森林</div><h1>曲率航迹</h1><p id="status" role="status">正在连接自然选择号</p><progress id="progress" max="1" value="0"></progress><button id="retry" type="button" onclick="location.reload()">重新载入</button></div></main><footer><span>WASD / 方向键移动 · 自动开火 · J 智子 · K 二向箔 · L 冲刺 · Enter 继续</span><span id="rotate">横屏体验更佳</span><span>拖动鼠标移动 · 点击技能释放</span></footer><script>
const canvas=document.getElementById('unity-canvas');let game;
const fail=message=>{document.getElementById('loading').style.display='grid';document.getElementById('status').textContent=message;document.getElementById('retry').style.display='block';document.getElementById('progress').style.display='none';};
const script=document.createElement('script');script.src='Build/unity.loader.js';script.onerror=()=>fail('加载失败，请检查网络后重试');script.onload=()=>createUnityInstance(canvas,{
 dataUrl:'Build/unity.data.unityweb',frameworkUrl:'Build/unity.framework.js.unityweb',codeUrl:'Build/unity.wasm.unityweb',streamingAssetsUrl:'StreamingAssets',companyName:'Curvature',productName:'曲率航迹',productVersion:'1.0',devicePixelRatio:Math.min(window.devicePixelRatio||1,1.5),
 showBanner:(msg,type)=>{console[type==='error'?'error':'warn'](msg);if(type==='error')fail('游戏载入失败，请刷新重试');}
},p=>{document.getElementById('progress').value=p;document.getElementById('status').textContent='正在启动舰载系统 '+Math.round(p*100)+'%';}).then(instance=>{game=instance;document.getElementById('loading').style.display='none';canvas.focus();}).catch(error=>{console.error(error);fail('游戏启动失败，请使用支持 WebGL 2 的浏览器重试');});document.body.appendChild(script);
document.getElementById('fullscreen').onclick=()=>{if(game)game.SetFullscreen(1);canvas.focus();};
</script></body></html>
